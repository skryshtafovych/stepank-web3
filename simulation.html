<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosystem Evolution Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .slider-label {
            min-width: 160px;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold text-center mb-2 text-cyan-400">Ecosystem Evolution Simulator</h1>
        <p class="text-center text-gray-400 mb-6">Watch species interact, compete, and evolve in a virtual world.</p>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Canvas for the simulation -->
            <div class="lg:col-span-2 bg-gray-800 rounded-2xl shadow-2xl overflow-hidden">
                <canvas id="ecosystemCanvas" class="w-full h-full"></canvas>
            </div>

            <!-- Controls and settings -->
            <div class="bg-gray-800 rounded-2xl shadow-2xl p-6 flex flex-col justify-between">
                <div>
                    <h2 class="text-2xl font-semibold mb-4 text-cyan-300">Controls</h2>
                    <div class="flex space-x-2 mb-6">
                        <button id="startBtn" class="flex-1 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-lg">Start</button>
                        <button id="stopBtn" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-lg">Stop</button>
                        <button id="resetBtn" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-4 rounded-lg transition duration-300 shadow-lg">Reset</button>
                    </div>

                    <h2 class="text-2xl font-semibold mb-4 mt-6 text-cyan-300">Parameters</h2>
                    <div class="space-y-4">
                        <div class="flex items-center">
                            <label for="plantGrowthRate" class="slider-label text-gray-300">Plant Growth Rate:</label>
                            <input type="range" id="plantGrowthRate" min="0.01" max="0.2" step="0.01" value="0.1" class="w-full">
                        </div>
                        <div class="flex items-center">
                            <label for="initialHerbivores" class="slider-label text-gray-300">Initial Herbivores:</label>
                            <input type="range" id="initialHerbivores" min="1" max="50" value="20" class="w-full">
                        </div>
                        <div class="flex items-center">
                            <label for="initialCarnivores" class="slider-label text-gray-300">Initial Carnivores:</label>
                            <input type="range" id="initialCarnivores" min="1" max="20" value="5" class="w-full">
                        </div>
                         <div class="flex items-center">
                            <label for="herbivoreSpeed" class="slider-label text-gray-300">Herbivore Speed:</label>
                            <input type="range" id="herbivoreSpeed" min="0.1" max="3" step="0.1" value="1" class="w-full">
                        </div>
                        <div class="flex items-center">
                            <label for="herbivoreVision" class="slider-label text-gray-300">Herbivore Vision:</label>
                            <input type="range" id="herbivoreVision" min="10" max="200" step="1" value="75" class="w-full">
                        </div>
                        <div class="flex items-center">
                            <label for="carnivoreSpeed" class="slider-label text-gray-300">Carnivore Speed:</label>
                            <input type="range" id="carnivoreSpeed" min="0.1" max="3" step="0.1" value="1.2" class="w-full">
                        </div>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-gray-700">
                    <h3 class="text-xl font-semibold text-cyan-300 mb-3">Statistics</h3>
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div>
                            <p class="text-3xl font-bold text-green-400" id="plantCount">0</p>
                            <p class="text-sm text-gray-400">Plants</p>
                        </div>
                        <div>
                            <p class="text-3xl font-bold text-blue-400" id="herbivoreCount">0</p>
                            <p class="text-sm text-gray-400">Herbivores</p>
                        </div>
                        <div>
                            <p class="text-3xl font-bold text-red-400" id="carnivoreCount">0</p>
                            <p class="text-sm text-gray-400">Carnivores</p>
                        </div>
                        <div>
                            <p class="text-3xl font-bold text-gray-300" id="dayCount">0</p>
                            <p class="text-sm text-gray-400">Days</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // <!-- Main simulation script -->
        const canvas = document.getElementById('ecosystemCanvas');
        const ctx = canvas.getContext('2d');

        let animationFrameId;
        let organisms = [];
        let day = 0;

        // --- Entity Classes ---
        class Organism {
            constructor(x, y, radius, color) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.energy = 100;
                this.age = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            update() {
                this.age++;
                this.energy -= 0.1; // Base energy decay
            }
        }

        class Plant extends Organism {
            constructor(x, y) {
                super(x, y, 3, 'rgba(34, 197, 94, 0.8)');
                this.energy = 20;
            }
        }

        class Animal extends Organism {
            constructor(x, y, radius, color, speed, vision) {
                super(x, y, radius, color);
                this.speed = speed;
                this.vision = vision;
                this.energy = 100;
                this.reproductionCooldown = 0;
            }

            move() {
                this.x += (Math.random() - 0.5) * this.speed * 2;
                this.y += (Math.random() - 0.5) * this.speed * 2;

                // Boundary checks
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                this.energy -= 0.2 * (this.speed / 2);
            }

            reproduce(offspringType) {
                if (this.energy > 150 && this.reproductionCooldown <= 0) {
                    this.energy -= 50;
                    this.reproductionCooldown = 100; // Cooldown period
                    const newX = this.x + (Math.random() - 0.5) * 20;
                    const newY = this.y + (Math.random() - 0.5) * 20;
                    organisms.push(new offspringType(newX, newY));
                }
                if (this.reproductionCooldown > 0) {
                    this.reproductionCooldown--;
                }
            }
        }

        class Herbivore extends Animal {
            constructor(x, y) {
                const speed = parseFloat(document.getElementById('herbivoreSpeed').value);
                const vision = parseFloat(document.getElementById('herbivoreVision').value);
                super(x, y, 5, 'rgba(59, 130, 246, 0.9)', speed, vision);
            }

            draw() {
                // Draw vision radius
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.vision, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.2)';
                ctx.stroke();

                // Draw the organism itself
                super.draw();
            }

            move() {
                // Find the nearest plant within vision range
                let closestPlant = null;
                let minDistance = this.vision;

                for (const org of organisms) {
                    if (org instanceof Plant) {
                        const dist = Math.hypot(this.x - org.x, this.y - org.y);
                        if (dist < minDistance) {
                            minDistance = dist;
                            closestPlant = org;
                        }
                    }
                }

                if (closestPlant) {
                    // Move towards the closest plant
                    const angle = Math.atan2(closestPlant.y - this.y, closestPlant.x - this.x);
                    this.x += Math.cos(angle) * this.speed;
                    this.y += Math.sin(angle) * this.speed;
                } else {
                    // If no plant is in sight, move randomly
                    super.move(); // Call the parent's move method for random movement
                    return; // Return early as super.move() already handles energy and boundaries
                }

                // Boundary checks (only if not calling super.move())
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                // Energy consumption for targeted movement
                this.energy -= 0.2 * (this.speed / 2);
            }

            eat() {
                for (let i = organisms.length - 1; i >= 0; i--) {
                    const org = organisms[i];
                    if (org instanceof Plant) {
                        const dist = Math.hypot(this.x - org.x, this.y - org.y);
                        if (dist < this.radius + org.radius) {
                            this.energy += org.energy;
                            organisms.splice(i, 1);
                            break; // Eat one plant per update
                        }
                    }
                }
            }

            update() {
                super.update(); // From Organism: handles aging and base energy decay
                this.move();
                this.eat();
                this.reproduce(Herbivore);
            }
        }

        class Carnivore extends Animal {
            constructor(x, y) {
                const speed = parseFloat(document.getElementById('carnivoreSpeed').value);
                super(x, y, 7, 'rgba(239, 68, 68, 0.9)', speed);
                this.energy = 150;
            }

.
            hunt() {
                for (let i = organisms.length - 1; i >= 0; i--) {
                    const org = organisms[i];
                    if (org instanceof Herbivore) {
                        const dist = Math.hypot(this.x - org.x, this.y - org.y);
                        if (dist < this.radius + org.radius) {
                            this.energy += org.energy;
                            organisms.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            update() {
                super.update();
                this.move();
                this.hunt();
                this.reproduce(Carnivore);
            }
        }

        // --- Simulation Logic ---
        function init() {
            // Set canvas size
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;

            organisms = [];
            day = 0;

            const initialHerbivores = document.getElementById('initialHerbivores').value;
            const initialCarnivores = document.getElementById('initialCarnivores').value;

            // Initial population
            for (let i = 0; i < initialHerbivores; i++) {
                organisms.push(new Herbivore(Math.random() * canvas.width, Math.random() * canvas.height));
            }
            for (let i = 0; i < initialCarnivores; i++) {
                organisms.push(new Carnivore(Math.random() * canvas.width, Math.random() * canvas.height));
            }
        }

        function updateStats() {
            const plantCount = organisms.filter(o => o instanceof Plant).length;
            const herbivoreCount = organisms.filter(o => o instanceof Herbivore).length;
            const carnivoreCount = organisms.filter(o => o instanceof Carnivore).length;

            document.getElementById('plantCount').textContent = plantCount;
            document.getElementById('herbivoreCount').textContent = herbivoreCount;
            document.getElementById('carnivoreCount').textContent = carnivoreCount;
            document.getElementById('dayCount').textContent = Math.floor(day / 10); // arbitrary day length
        }

        function gameLoop() {
            // Clear canvas
            ctx.fillStyle = 'rgba(17, 24, 39, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add new plants
            const plantGrowthRate = document.getElementById('plantGrowthRate').value;
            if (Math.random() < plantGrowthRate) {
                organisms.push(new Plant(Math.random() * canvas.width, Math.random() * canvas.height));
            }

            // Update and draw organisms
            for (let i = organisms.length - 1; i >= 0; i--) {
                const org = organisms[i];
                org.update();
                org.draw();

                // Remove dead organisms
                if (org.energy <= 0 || org.age > 1000) {
                    organisms.splice(i, 1);
                }
            }

            day++;
            updateStats();

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        // --- Event Listeners ---
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!animationFrameId) {
                gameLoop();
            }
        });

        document.getElementById('stopBtn').addEventListener('click', () => {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
        });

        document.getElementById('resetBtn').addEventListener('click', () => {
            cancelAnimationFrame(animationFrameId);
            animationFrameId = null;
            init();
            // Redraw initial state
            ctx.fillStyle = 'rgba(17, 24, 39, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            organisms.forEach(org => org.draw());
            updateStats();
        });

        window.addEventListener('resize', () => {
            init();
        });

        // Initial setup
        init();
        updateStats();
         // Redraw initial state
        ctx.fillStyle = 'rgba(17, 24, 39, 1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        organisms.forEach(org => org.draw());
    </script>
</body>
</html>
